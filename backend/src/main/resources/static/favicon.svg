<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="synapseGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle with dark neural depth -->
  <rect width="64" height="64" rx="16" fill="#0c1322" />
  <!-- Synaptic Axon Connections -->
  <path d="M32 14L16 26M32 14L48 26M16 26L22 46M48 26L42 46M22 46L32 34M42 46L32 34M32 14L32 34" stroke="url(#synapseGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <!-- Central Synaptic Node -->
  <circle cx="32" cy="34" r="6" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="32" cy="34" r="3" fill="#ffffff" />
  <!-- Peripheral Channel Nodes -->
  <circle cx="32" cy="14" r="4.5" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="32" cy="14" r="2" fill="#ffffff" />
  <circle cx="16" cy="26" r="4" fill="#06b6d4" />
  <circle cx="16" cy="26" r="1.8" fill="#ffffff" />
  <circle cx="48" cy="26" r="4" fill="#0ea5e9" />
  <circle cx="48" cy="26" r="1.8" fill="#ffffff" />
  <circle cx="22" cy="46" r="4" fill="#a855f7" />
  <circle cx="22" cy="46" r="1.8" fill="#ffffff" />
  <circle cx="42" cy="46" r="4" fill="#ec4899" />
  <circle cx="42" cy="46" r="1.8" fill="#ffffff" />
</svg>
