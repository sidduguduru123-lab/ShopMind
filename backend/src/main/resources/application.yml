server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: synapse-omnichannel-backend
  datasource:
    # Default zero-friction embedded database with persistence across runs (overridden by DATABASE_URL on Render/PostgreSQL)
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/shopmind_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  jwt:
    # 256-bit secret key for HMAC-SHA256
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  ai-service:
    url: http://127.0.0.1:8000

logging:
  level:
    com.shopmind: INFO
    org.springframework.security: WARN
